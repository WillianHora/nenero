services:
  nenero:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${EXPO_PUBLIC_GEMINI_API_KEY:-}}
      PORT: 8080
    ports:
      - "${NENERO_PORT:-8080}:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - nenero
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
